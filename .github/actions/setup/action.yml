name: Pinned application tooling
description: Install the pinned Node and pnpm versions with a lockfile-keyed download cache.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24.22.1
    - shell: bash
      run: corepack enable && corepack prepare pnpm@12.15.0 --activate
    - id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ runner.os }}-node24-pnpm12-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-node24-pnpm12-
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm types:bindings
