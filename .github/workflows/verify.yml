name: Verify application
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  WRANGLER_SEND_METRICS: "false"
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - id: changes
        env:
          CI_FORCE_FULL: ${{ inputs.force_full || false }}
        run: node scripts/ci.ts classify
      - run: node scripts/check-doc-links.ts
  checks:
    needs: classify
    if: needs.classify.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm exec vitest run --project backend --project tooling
  build:
    needs: classify
    if: needs.classify.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-local-node24-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-next-local-node24-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build:worker && pnpm build:jobs
      - name: Package only generated test bundles
        run: tar -cf "$RUNNER_TEMP/test-workers.tar" apps/web/.open-next apps/jobs/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-workers-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-workers.tar
          compression-level: 1
          retention-days: 3
          if-no-files-found: error
  worker:
    name: Worker integration
    needs: [classify, build]
    if: needs.classify.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-workers-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-workers
      - run: tar -xf "$RUNNER_TEMP/test-workers/test-workers.tar"
      - run: pnpm test:worker
  browser:
    name: Browser (${{ matrix.project }})
    needs: [classify, build]
    if: needs.classify.outputs.docs_only == 'false'
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-workers-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-workers
      - run: tar -xf "$RUNNER_TEMP/test-workers/test-workers.tar"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=${{ matrix.project }} --reporter=line,html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
  gate:
    name: CI gate
    if: always()
    needs: [classify, checks, build, worker, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Require every applicable check and record tested tree
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci.ts receipt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt.json
          retention-days: 30
          if-no-files-found: error
